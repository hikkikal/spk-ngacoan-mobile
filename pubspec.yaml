name: spk_ngacoan
description: "SPK Pemilihan Supplier Bahan Baku UMKM Mie Ngacoan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # API & Networking
  dio: ^5.7.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Storage
  flutter_secure_storage: ^9.2.2

  # Auth
  # google_sign_in: ^6.2.1
  local_auth: ^2.3.0

  # Routing
  go_router: ^14.2.7

  # Splash
  flutter_native_splash: ^2.4.1

  # Utils
  flutter_svg: ^2.0.10+1

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0    

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

